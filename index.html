:root{--ink:#18364f;--mut:#536d7b;--edge:#24465d;--card:#fffefa;--m:#fa785c;--s:#19a994;--sun:#ffd45e}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--ink);font:500 17px/1.75 "Cairo",sans-serif;background-color:#e8f8f5;background-image:radial-gradient(circle at 20px 20px,#ffdc79 2px,transparent 3px),radial-gradient(circle at 78px 70px,#a6dce6 3px,transparent 4px),linear-gradient(180deg,#d8f4ff 0%,#eaf9f2 48%,#fff8e9 100%);background-size:110px 110px,145px 145px,auto}
button,input{font-family:"Cairo",sans-serif}button{cursor:pointer;color:inherit}button:focus-visible,a:focus-visible,input:focus-visible{outline:4px solid #ffbd42;outline-offset:4px}
.wrap{max-width:1050px;margin:auto;padding:20px 24px 36px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 20px}
.logo{font:42px/1 "Lalezar",sans-serif;display:flex;align-items:center;gap:12px;border:0;background:none;padding:0;color:var(--ink)}
.logo-mark{width:56px;height:56px;display:grid;place-items:center;border:3px solid var(--edge);border-radius:20px;background:#ffe38a;box-shadow:4px 5px 0 #9dc7ce;transform:rotate(-9deg)}
.logo-mark svg{width:31px;height:31px;stroke-width:2.3}
.logo-image{display:block;width:76px;height:76px;object-fit:contain;border-radius:50%}
.hero-title-image{display:block;width:clamp(170px,32vw,250px);height:auto;margin:0 auto;mix-blend-mode:multiply}
.pill{display:flex;align-items:center;gap:8px;background:#fff8d2;border:3px solid var(--edge);border-radius:99px;padding:4px 17px;font-weight:900;box-shadow:4px 5px 0 #d4b869;font-size:20px}
.pill svg{width:21px;fill:#ffc743;color:#d89123}
.hero{position:relative;isolation:isolate;overflow:hidden;text-align:center;padding:42px 20px 120px;border:4px solid var(--edge);border-radius:42px;background:linear-gradient(180deg,#83d8f5 0%,#c8f2f9 72%,#effce8 100%);box-shadow:8px 10px 0 #91c8c7}
.hero:before{content:"";position:absolute;z-index:-1;bottom:-63px;left:-8%;width:75%;height:150px;background:#a3dd87;border-radius:50%}
.hero:after{content:"";position:absolute;z-index:-1;bottom:-78px;right:-12%;width:83%;height:160px;background:#65c893;border-radius:50%}
.cloud{position:absolute;background:#fff;width:99px;height:32px;border-radius:30px;opacity:.95;top:65px;left:9%;filter:drop-shadow(0 5px 0 #a5dfe9)}
.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}.cloud:before{width:43px;height:43px;bottom:7px;left:16px}.cloud.two-cloud{left:auto;right:8%;top:105px;transform:scale(.72)}
.sun{position:absolute;top:34px;right:20%;width:68px;height:68px;background:#ffda65;border:3px solid #e9a944;border-radius:50%;box-shadow:0 0 0 11px #fff2a687}
.hero-art{width:142px;height:125px;margin:0 auto -7px;position:relative;display:grid;place-items:center}
.hero-art:before{content:"";position:absolute;width:112px;height:112px;border:3px dashed #4fa8ac;border-radius:50%;transform:rotate(-20deg)}
.hero-art svg{width:89px;height:89px;color:#24566b;stroke-width:1.7;filter:drop-shadow(4px 5px 0 #ffffffa8)}
.spark{position:absolute;color:#f47760}.spark.a{top:3px;left:4px}.spark.b{bottom:5px;right:2px}.spark svg{width:24px}
.hero h1{font:clamp(72px,13vw,110px)/1 "Lalezar",sans-serif;color:#fffdf4;margin:0;-webkit-text-stroke:5px var(--edge);paint-order:stroke fill;text-shadow:5px 7px 0 #236c83}
.hero p{margin:4px 0;font-weight:900}.hero .by{display:inline-block;margin-top:14px;background:#fffefa;border:3px solid var(--edge);border-radius:30px;padding:3px 18px;font-size:14px;box-shadow:4px 5px 0 #b5d6ca;transform:rotate(-2deg)}
.ground-art{position:absolute;bottom:12px;right:0;left:0;display:flex;justify-around;align-items:end;pointer-events:none;color:#258464}.ground-art svg{width:39px;height:43px;stroke-width:2}.ground-art .house{width:61px;height:60px;color:#f1745c}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:30px 0}
.big{border:4px solid var(--edge);border-radius:34px;min-height:215px;padding:22px;text-align:center;color:white;box-shadow:6px 8px 0 #9dbebf;transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden}
.big:before{content:"✦";position:absolute;top:10px;right:24px;font-size:28px;color:#ffffff99}.big:after{content:"✿";position:absolute;bottom:5px;left:21px;font-size:27px;color:#ffffff99}
.big.math{background:#f47b64}.big.science{background:#21ae96}.big:hover,.card:hover{transform:translateY(-5px) rotate(0);box-shadow:8px 12px 0 #91bdbd}.big:active,.card:active{transform:translateY(2px)}
.big .icon-badge{display:grid;place-items:center;width:84px;height:84px;margin:0 auto 8px;border:3px solid #fff;border-radius:26px;background:#ffffff30;transform:rotate(-7deg)}
.big .icon-badge svg{width:47px;height:47px;stroke-width:1.9}.big strong{display:block;font:45px/1.1 "Lalezar",sans-serif;text-shadow:2px 3px 0 #0002}.big small{display:block;font-size:14px;font-weight:900;color:white}
h2{font:40px/1.35 "Lalezar",sans-serif;margin:25px 0 15px}
.back{background:#fffefa;border:3px solid var(--edge);border-radius:99px;padding:6px 17px;font-weight:900;box-shadow:4px 5px 0 #bfdad3;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:19px}
.card{width:100%;min-height:164px;padding:17px 15px;border:3px solid var(--edge);border-radius:27px;text-align:center;background:var(--card);box-shadow:5px 6px 0 #b5d5d0;transition:transform .2s,box-shadow .2s}.card:nth-child(odd){transform:rotate(-1deg)}.card:nth-child(even){transform:rotate(1deg)}
.card .e{display:grid;place-items:center;width:66px;height:66px;border:2px solid var(--edge);border-radius:21px;margin:0 auto 10px;background:#ffe4d4;color:#c9624e}.card:nth-child(4n+2) .e{background:#d5f3dc;color:#228e70}.card:nth-child(4n+3) .e{background:#e8e0fa;color:#7860b6}.card:nth-child(4n+4) .e{background:#fff0bc;color:#a77b25}.card .e svg{width:35px;height:35px;stroke-width:1.9}.card b{display:block;font-size:17px;line-height:1.5}.card .detail{color:var(--mut);font-size:13px;font-weight:700}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 19px}.tab{background:#fffefa;border:2px solid var(--edge);border-radius:99px;padding:7px 16px;font-weight:900;box-shadow:3px 4px 0 #d0e0d8}.tab.on{background:var(--c,#f47b64);color:white;box-shadow:none;transform:translateY(3px)}
.box{background:var(--card);border:3px solid var(--edge);border-radius:31px;padding:24px;box-shadow:6px 8px 0 #b9d9d2;min-height:180px}.box p{line-height:2}.box h3{font-size:21px}.explainer{background:#e8f8ed;border:2px dashed #9ed6bb;border-radius:20px;padding:15px 19px;margin-bottom:17px}
.story{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}.pn{position:relative;text-align:center;background:#fff7e8;border:2px solid var(--edge);border-radius:23px;padding:18px 11px;box-shadow:4px 5px 0 #e1d8bb}.pn i{position:absolute;top:-10px;right:-8px;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--c,#ef8067);color:white;font-style:normal;font-weight:900}.pn .em{font-size:48px;min-height:80px;display:grid;place-items:center}.pn p{margin:3px 0;font-size:14px;font-weight:700;line-height:1.7}
.scene{padding:20px;text-align:center;background:#eef8ed;border:2px dashed #a4cbbd;border-radius:20px;font-size:43px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;background:var(--c,#f47560);color:white;border:2px solid var(--edge);border-radius:99px;padding:9px 20px;font-weight:900;box-shadow:3px 4px 0 #a8c6bf;margin:7px 5px 5px 0}.btn:hover{filter:brightness(1.06);transform:translateY(-2px)}.btn svg{width:18px}
.opt{display:block;width:100%;margin:11px 0;padding:12px 16px;border:2px solid #94bcb5;border-radius:18px;text-align:right;background:#f3faf5;font-weight:700}.opt:hover:not(:disabled){background:#e1f4e9}.opt.ok{background:#b9edcd;border-color:#299d62}.opt.no{background:#ffe0dd;border-color:#e06460}
.lv{display:inline-block;background:#ffedb6;border-radius:12px;padding:1px 12px;font-size:13px;font-weight:900}.bar,.bar2{height:13px;border-radius:12px;background:#d9e7df;overflow:hidden;margin:12px 0}.bar i,.bar2 i{display:block;height:100%;background:#f8c766}.bar i{animation:tm 10s linear forwards}@keyframes tm{to{width:0}}
.track{border-bottom:3px dashed #96c1b1;height:42px;position:relative}.track span{position:absolute;bottom:0;transition:right .4s}.res{text-align:center;font-size:45px}.res h3{font-size:24px}
